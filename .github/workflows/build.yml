name: Build CCTV Plus v2.0 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Release Keystore from Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASS" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASS" ]; then
            echo "::error::Missing signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS)"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > /tmp/release.jks

      - name: Prepare Custom Icon, Banner, Manifest and Gradle Configs
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > app/src/main/res/drawable/ic_cctv_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#121417"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#1C242B"
                  android:strokeColor="#10B981"
                  android:strokeWidth="3.2"
                  android:pathData="M16,24 C16,19.5 19.5,16 24,16 L84,16 C88.5,16 92,19.5 92,24 L92,68 C92,72.5 88.5,76 84,76 L24,76 C19.5,76 16,72.5 16,68 Z"/>
              <path
                  android:fillColor="#10B981"
                  android:pathData="M40,81 L68,81 L72,87 L36,87 Z"/>
              <path
                  android:fillColor="#10B981"
                  android:pathData="M50,76 L58,76 L58,82 L50,82 Z"/>
              <path
                  android:fillColor="#10B981"
                  android:pathData="M42,32 L42,60 L66,46 Z"/>
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M75,22 L79,22 L79,34 L75,34 Z"/>
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M71,26 L83,26 L83,30 L71,30 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/tv_banner.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp"
              android:height="180dp"
              android:viewportWidth="320"
              android:viewportHeight="180">
              <path
                  android:fillColor="#121417"
                  android:pathData="M0,0h320v180h-320z"/>
              <path
                  android:fillColor="#1C242B"
                  android:strokeColor="#10B981"
                  android:strokeWidth="4"
                  android:pathData="M34,30 C34,23 39,18 46,18 L274,18 C281,18 286,23 286,30 L286,136 C286,143 281,148 274,148 L46,148 C39,148 34,143 34,136 Z"/>
              <path
                  android:fillColor="#10B981"
                  android:pathData="M148,148 L172,148 L172,158 L148,158 Z"/>
              <path
                  android:fillColor="#10B981"
                  android:pathData="M118,158 L202,158 L212,167 L108,167 Z"/>
              <path
                  android:fillColor="#10B981"
                  android:pathData="M138,54 L138,112 L190,83 Z"/>
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M242,32 L250,32 L250,60 L242,60 Z"/>
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M232,42 L260,42 L260,50 L232,50 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:icon="@drawable/ic_cctv_launcher"
                  android:roundIcon="@drawable/ic_cctv_launcher"
                  android:banner="@drawable/tv_banner"
                  android:label="CCTV Plus"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:supportsPictureInPicture="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".ReminderReceiver"
                      android:exported="false" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.myiptv.app.provider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="updates" path="." />
              <cache-path name="cache_updates" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="sharedpref" path="." />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="sharedpref" path="." />
              </device-transfer>
          </data-extraction-rules>
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          -keep class com.myiptv.app.ReminderReceiver { *; }
          -keep class androidx.media3.decoder.ffmpeg.** { *; }
          -dontwarn androidx.media3.decoder.ffmpeg.**
          -keepclasseswithmembernames class * {
              native <methods>;
          }
          -dontwarn org.bouncycastle.**
          -dontwarn org.conscrypt.**
          -dontwarn org.openjsse.**
          -dontwarn okhttp3.**
          -dontwarn okio.**
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyIPTV"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=35
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.myiptv.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.myiptv.app"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = ${{ github.run_number }}
                  versionName = "2.0.${{ github.run_number }}"
                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a")
                  }
              }

              signingConfigs {
                  create("releaseSign") {
                      storeFile = file("/tmp/release.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASS")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASS")
                      enableV1Signing = true
                      enableV2Signing = true
                  }
              }

              buildTypes {
                  debug {
                      signingConfig = signingConfigs.getByName("releaseSign")
                  }
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                      signingConfig = signingConfigs.getByName("releaseSign")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.media3:media3-exoplayer:1.5.0")
              implementation("androidx.media3:media3-exoplayer-hls:1.5.0")
              implementation("androidx.media3:media3-exoplayer-dash:1.5.0")
              implementation("androidx.media3:media3-ui:1.5.0")
              implementation("org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("com.google.zxing:core:3.5.3")
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk /tmp/CCTV-Plus.apk
          sha256sum /tmp/CCTV-Plus.apk | awk '{print $1}' > /tmp/CCTV-Plus.apk.sha256
          rm -f /tmp/release.jks

      - name: Upload Ready APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CCTV-Plus-APK
          path: /tmp/CCTV-Plus.apk

      - name: Publish Release for In-App Auto-Update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "CCTV Plus v2.0.${{ github.run_number }}"
          body: "CCTV Plus v2.0 (Build #${{ github.run_number }})"
          make_latest: true
          files: |
            /tmp/CCTV-Plus.apk
            /tmp/CCTV-Plus.apk.sha256

      - name: Cleanup Old Releases (keep last 3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_TAGS=$(gh release list --repo "${{ github.repository }}" --limit 200 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName')
          for TAG in $OLD_TAGS; do
            echo "Deleting old release: $TAG"
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          done

      - name: Save Version Metadata to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- .
          git pull --rebase origin main || git pull --rebase origin master || true
          APK_SHA256=$(cat /tmp/CCTV-Plus.apk.sha256)
          printf '{"tag_name":"v2.0.%s","version_code":%s,"repo":"%s","sha256":"%s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" "${{ github.repository }}" "$APK_SHA256" > version.json
          git add version.json
          git commit -m "Update version.json v2.0.${{ github.run_number }} [skip ci]" || true
          git push || true
