name: Build CCTV Plus APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Permanent Digital Signature (Keystore)
        run: |
          mkdir -p ~/.android
          if [ ! -f cctv_permanent.keystore ]; then
            keytool -genkeypair -v -keystore cctv_permanent.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp cctv_permanent.keystore ~/.android/debug.keystore

      - name: Prepare Root Gradle Configs and FileProvider XML
        run: |
          mkdir -p app/src/main/res/xml
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="updates" path="." />
              <cache-path name="cache_updates" path="." />
          </paths>
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyIPTV"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk CCTV-Plus.apk

      - name: Save APK and Version Directly to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || git pull --rebase origin master || true
          echo '{"tag_name":"v1.${{ github.run_number }}","repo":"${{ github.repository }}"}' > version.json
          git add CCTV-Plus.apk version.json cctv_permanent.keystore
          git commit -m "Publish CCTV-Plus.apk v1.${{ github.run_number }} [skip ci]" || true
          git push || true

      - name: Upload Ready APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CCTV-Plus-APK
          path: CCTV-Plus.apk

      - name: Publish Release for In-App Auto-Update
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: "CCTV Plus v1.${{ github.run_number }}"
          body: "Автоматическая сборка обновления #${{ github.run_number }}"
          files: CCTV-Plus.apk
