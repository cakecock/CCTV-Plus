name: Build CCTV Plus v2.0 APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Release Keystore from Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASS" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASS" ]; then
            echo "::error::Missing signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS)"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > /tmp/release.jks
          rm -f /tmp/check.p12
          keytool -importkeystore -srckeystore /tmp/release.jks -srcstorepass "$ANDROID_KEYSTORE_PASS" -srcalias "$ANDROID_KEY_ALIAS" -srckeypass "$ANDROID_KEY_PASS" -destkeystore /tmp/check.p12 -deststorepass test1234 -destkeypass test1234 -noprompt >/dev/null
          rm -f /tmp/check.p12

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          gradle assembleRelease --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk /tmp/CCTV-Plus.apk
          sha256sum /tmp/CCTV-Plus.apk | awk '{print $1}' > /tmp/CCTV-Plus.apk.sha256
          rm -f /tmp/release.jks

      - name: Upload Ready APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CCTV-Plus-APK
          path: /tmp/CCTV-Plus.apk

      - name: Publish Release for In-App Auto-Update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "CCTV Plus v2.0.${{ github.run_number }}"
          body: "CCTV Plus v2.0 (Build #${{ github.run_number }})"
          make_latest: true
          files: |
            /tmp/CCTV-Plus.apk
            /tmp/CCTV-Plus.apk.sha256

      - name: Cleanup Old Releases (keep last 3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_TAGS=$(gh release list --repo "${{ github.repository }}" --limit 200 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName')
          for TAG in $OLD_TAGS; do
            echo "Deleting old release: $TAG"
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          done

      - name: Save Version Metadata to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- .
          git pull --rebase origin main || git pull --rebase origin master || true
          APK_SHA256=$(cat /tmp/CCTV-Plus.apk.sha256)
          printf '{"tag_name":"v2.0.%s","version_code":%s,"repo":"%s","sha256":"%s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" "${{ github.repository }}" "$APK_SHA256" > version.json
          git add version.json
          git commit -m "Update version.json v2.0.${{ github.run_number }} [skip ci]" || true
          git push || true
