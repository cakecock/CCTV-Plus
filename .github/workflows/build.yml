name: Build CCTV Plus v2.0 APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Release Keystore from Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASS" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASS" ]; then
            echo "::error::Missing signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS)"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > /tmp/release.jks
          rm -f /tmp/check.p12
          keytool -importkeystore -srckeystore /tmp/release.jks -srcstorepass "$ANDROID_KEYSTORE_PASS" -srcalias "$ANDROID_KEY_ALIAS" -srckeypass "$ANDROID_KEY_PASS" -destkeystore /tmp/check.p12 -deststorepass test1234 -destkeypass test1234 -noprompt >/dev/null
          rm -f /tmp/check.p12

      - name: Prepare Custom Icon, Banner, Manifest and Gradle Configs
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="linear"
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108">
                          <item android:offset="0.0" android:color="#091118"/>
                          <item android:offset="0.55" android:color="#101D27"/>
                          <item android:offset="1.0" android:color="#0A2B24"/>
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:fillColor="#1A10B981"
                  android:pathData="M54,12 A42,42 0 1,1 53.9,12 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#131E26"
                  android:strokeWidth="2.8"
                  android:pathData="M33,33 L75,33 C78.9,33 82,36.1 82,40 L82,64 C82,67.9 78.9,71 75,71 L33,71 C29.1,71 26,67.9 26,64 L26,40 C26,36.1 29.1,33 33,33 Z">
                  <aapt:attr name="android:strokeColor">
                      <gradient
                          android:type="linear"
                          android:startX="26"
                          android:startY="33"
                          android:endX="82"
                          android:endY="71">
                          <item android:offset="0.0" android:color="#34D399"/>
                          <item android:offset="1.0" android:color="#38BDF8"/>
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:fillColor="#16FFFFFF"
                  android:pathData="M33,35 L60,35 L44,57 L28,57 L28,40 C28,37.2 30.2,35 33,35 Z"/>
              <path android:pathData="M47,42 L47,62 L64,52 Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="linear"
                          android:startX="47"
                          android:startY="42"
                          android:endX="64"
                          android:endY="62">
                          <item android:offset="0.0" android:color="#34D399"/>
                          <item android:offset="1.0" android:color="#10B981"/>
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:fillColor="#10B981"
                  android:pathData="M44,74.5 L64,74.5 C65.1,74.5 66,75.4 66,76.5 C66,77.6 65.1,78.5 64,78.5 L44,78.5 C42.9,78.5 42,77.6 42,76.5 C42,75.4 42.9,74.5 44,74.5 Z"/>
              <path
                  android:fillColor="#F59E0B"
                  android:strokeColor="#091118"
                  android:strokeWidth="1.8"
                  android:pathData="M74,24.5 A8.5,8.5 0 1,1 73.99,24.5 Z"/>
              <path
                  android:fillColor="#091118"
                  android:pathData="M72.7,28.5 L75.3,28.5 L75.3,37.5 L72.7,37.5 Z"/>
              <path
                  android:fillColor="#091118"
                  android:pathData="M69.5,31.7 L78.5,31.7 L78.5,34.3 L69.5,34.3 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/tv_banner.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="320dp"
              android:height="180dp"
              android:viewportWidth="320"
              android:viewportHeight="180">
              <path android:pathData="M0,0h320v180h-320z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="linear"
                          android:startX="0"
                          android:startY="0"
                          android:endX="320"
                          android:endY="180">
                          <item android:offset="0.0" android:color="#091118"/>
                          <item android:offset="0.55" android:color="#101D27"/>
                          <item android:offset="1.0" android:color="#0A2B24"/>
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:fillColor="#131E26"
                  android:strokeWidth="4"
                  android:pathData="M48,22 L272,22 C280.8,22 288,29.2 288,38 L288,130 C288,138.8 280.8,146 272,146 L48,146 C39.2,146 32,138.8 32,130 L32,38 C32,29.2 39.2,22 48,22 Z">
                  <aapt:attr name="android:strokeColor">
                      <gradient
                          android:type="linear"
                          android:startX="32"
                          android:startY="22"
                          android:endX="288"
                          android:endY="146">
                          <item android:offset="0.0" android:color="#34D399"/>
                          <item android:offset="1.0" android:color="#38BDF8"/>
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:fillColor="#14FFFFFF"
                  android:pathData="M48,26 L160,26 L108,110 L36,110 L36,38 C36,31.4 41.4,26 48,26 Z"/>
              <path android:pathData="M140,56 L140,112 L190,84 Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="linear"
                          android:startX="140"
                          android:startY="56"
                          android:endX="190"
                          android:endY="112">
                          <item android:offset="0.0" android:color="#34D399"/>
                          <item android:offset="1.0" android:color="#10B981"/>
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:fillColor="#10B981"
                  android:pathData="M118,155 L202,155 C205.3,155 208,157.7 208,161 C208,164.3 205.3,167 202,167 L118,167 C114.7,167 112,164.3 112,161 C112,157.7 114.7,155 118,155 Z"/>
              <path
                  android:fillColor="#F59E0B"
                  android:strokeColor="#091118"
                  android:strokeWidth="3"
                  android:pathData="M266,24 A16,16 0 1,1 265.98,24 Z"/>
              <path
                  android:fillColor="#091118"
                  android:pathData="M263.5,31 L268.5,31 L268.5,49 L263.5,49 Z"/>
              <path
                  android:fillColor="#091118"
                  android:pathData="M257,37.5 L275,37.5 L275,42.5 L257,42.5 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:banner="@drawable/tv_banner"
                  android:label="CCTV Plus"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:supportsPictureInPicture="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".ReminderReceiver"
                      android:exported="false" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.myiptv.app.provider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="updates" path="." />
              <cache-path name="cache_updates" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="sharedpref" path="." />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="sharedpref" path="." />
              </device-transfer>
          </data-extraction-rules>
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          -keep class com.myiptv.app.ReminderReceiver { *; }
          -keep class androidx.media3.decoder.ffmpeg.** { *; }
          -dontwarn androidx.media3.decoder.ffmpeg.**
          -keepclasseswithmembernames class * {
              native <methods>;
          }
          -dontwarn org.bouncycastle.**
          -dontwarn org.conscrypt.**
          -dontwarn org.openjsse.**
          -dontwarn okhttp3.**
          -dontwarn okio.**
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyIPTV"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=35
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.myiptv.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.myiptv.app"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = ${{ github.run_number }}
                  versionName = "2.0.${{ github.run_number }}"
                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a")
                  }
              }

              signingConfigs {
                  create("releaseSign") {
                      storeFile = file("/tmp/release.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASS")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASS")
                      enableV1Signing = true
                      enableV2Signing = true
                  }
              }

              buildTypes {
                  debug {
                      signingConfig = signingConfigs.getByName("releaseSign")
                  }
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                      signingConfig = signingConfigs.getByName("releaseSign")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.media3:media3-exoplayer:1.5.0")
              implementation("androidx.media3:media3-exoplayer-hls:1.5.0")
              implementation("androidx.media3:media3-exoplayer-dash:1.5.0")
              implementation("androidx.media3:media3-ui:1.5.0")
              implementation("org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("com.google.zxing:core:3.5.3")
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          gradle assembleRelease --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk /tmp/CCTV-Plus.apk
          sha256sum /tmp/CCTV-Plus.apk | awk '{print $1}' > /tmp/CCTV-Plus.apk.sha256
          rm -f /tmp/release.jks

      - name: Upload Ready APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CCTV-Plus-APK
          path: /tmp/CCTV-Plus.apk

      - name: Publish Release for In-App Auto-Update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "CCTV Plus v2.0.${{ github.run_number }}"
          body: "CCTV Plus v2.0 (Build #${{ github.run_number }})"
          make_latest: true
          files: |
            /tmp/CCTV-Plus.apk
            /tmp/CCTV-Plus.apk.sha256

      - name: Cleanup Old Releases (keep last 3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_TAGS=$(gh release list --repo "${{ github.repository }}" --limit 200 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName')
          for TAG in $OLD_TAGS; do
            echo "Deleting old release: $TAG"
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          done

      - name: Save Version Metadata to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- .
          git pull --rebase origin main || git pull --rebase origin master || true
          APK_SHA256=$(cat /tmp/CCTV-Plus.apk.sha256)
          printf '{"tag_name":"v2.0.%s","version_code":%s,"repo":"%s","sha256":"%s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" "${{ github.repository }}" "$APK_SHA256" > version.json
          git add version.json
          git commit -m "Update version.json v2.0.${{ github.run_number }} [skip ci]" || true
          git push || true
