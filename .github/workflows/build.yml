name: Build CCTV Plus APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Lock Permanent Digital Signature
        run: |
          if [ ! -f cctv_permanent.keystore ]; then
            keytool -genkeypair -v -keystore cctv_permanent.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=CCTV Plus,O=Android,C=RU"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            for i in 1 2 3; do
              git pull --rebase origin main || git pull --rebase origin master || true
              git add cctv_permanent.keystore
              git commit -m "Lock permanent keystore signature [skip ci]" || true
              git push && break
              sleep 2
            done
          fi

      - name: Prepare Custom Icon, Manifest and Gradle Configs
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > app/src/main/res/drawable/ic_cctv_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#121417"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#1C242B"
                  android:strokeColor="#10B981"
                  android:strokeWidth="3.2"
                  android:pathData="M16,24 C16,19.5 19.5,16 24,16 L84,16 C88.5,16 92,19.5 92,24 L92,68 C92,72.5 88.5,76 84,76 L24,76 C19.5,76 16,72.5 16,68 Z"/>
              <path
                  android:fillColor="#10B981"
                  android:pathData="M40,81 L68,81 L72,87 L36,87 Z"/>
              <path
                  android:fillColor="#10B981"
                  android:pathData="M50,76 L58,76 L58,82 L50,82 Z"/>
              <path
                  android:fillColor="#10B981"
                  android:pathData="M42,32 L42,60 L66,46 Z"/>
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M75,22 L79,22 L79,34 L75,34 Z"/>
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M71,26 L83,26 L83,30 L71,30 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_cctv_launcher"
                  android:roundIcon="@drawable/ic_cctv_launcher"
                  android:banner="@drawable/ic_cctv_launcher"
                  android:label="CCTV Plus"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:supportsPictureInPicture="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.myiptv.app.provider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="updates" path="." />
              <cache-path name="cache_updates" path="." />
          </paths>
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyIPTV"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.myiptv.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.myiptv.app"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = ${{ github.run_number }}
                  versionName = "1.${{ github.run_number }}"
              }

              signingConfigs {
                  create("releaseSign") {
                      storeFile = rootProject.file("cctv_permanent.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                      enableV1Signing = true
                      enableV2Signing = true
                  }
              }

              buildTypes {
                  debug {
                      signingConfig = signingConfigs.getByName("releaseSign")
                  }
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("releaseSign")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.media3:media3-exoplayer:1.4.0")
              implementation("androidx.media3:media3-exoplayer-hls:1.4.0")
              implementation("androidx.media3:media3-exoplayer-dash:1.4.0")
              implementation("androidx.media3:media3-ui:1.4.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("com.google.zxing:core:3.5.3")
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk /tmp/CCTV-Plus.apk

      - name: Upload Ready APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CCTV-Plus-APK
          path: /tmp/CCTV-Plus.apk

      - name: Publish Release for In-App Auto-Update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: "CCTV Plus v1.${{ github.run_number }}"
          body: "Автоматическая сборка обновления #${{ github.run_number }}"
          make_latest: true
          files: /tmp/CCTV-Plus.apk

      - name: Save APK and Version Directly to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- .
          git pull --rebase origin main || git pull --rebase origin master || true
          cp /tmp/CCTV-Plus.apk ./CCTV-Plus.apk
          printf '{"tag_name":"v1.%s","version_code":%s,"repo":"%s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" "${{ github.repository }}" > version.json
          git add -f CCTV-Plus.apk version.json
          git commit -m "Publish CCTV-Plus.apk v1.${{ github.run_number }} [skip ci]" || true
          git push || true
